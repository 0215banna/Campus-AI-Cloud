services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: campus-ai-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

  campus-ai-api:
    build:
      context: ./backend
    container_name: campus-ai-api
    ports:
      - "8000:8000"
    volumes:
      - campus-ai-data:/app/data
    restart: unless-stopped

volumes:
  open-webui-data:
  campus-ai-data: